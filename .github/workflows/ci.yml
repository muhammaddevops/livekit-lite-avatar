name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # the release workflow runs the whole suite on the tagged commit first

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # an exact version: setup-uv publishes no major tags
      - run: uvx ruff@0.17.4 check src tests examples scripts
      - run: uvx ruff@0.17.4 format --check src tests examples scripts

  agent:
    name: agent side (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # an exact version: setup-uv publishes no major tags
        with:
          cache-python: true  # keep uv's Python downloads in the Actions cache
      - name: Install the agent side only (no torch), latest compatible dependencies
        run: |
          uv venv -p ${{ matrix.python }} .venv
          uv pip install -p .venv/bin/python -e ".[dev]"
      - name: Tests (renderer tests skip themselves without the renderer extra)
        run: .venv/bin/pytest -p no:warnings -rs
      - name: Build and check the distribution
        if: matrix.python == '3.12'
        run: |
          uv build
          uvx twine check --strict dist/*

  renderer:
    name: renderer, live e2e and benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # an exact version: setup-uv publishes no major tags
        with:
          cache-python: true
      - name: Restore LiteAvatar assets (~1.3 GB, downloaded from upstream on a cache miss)
        id: assets
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/livekit-lite-avatar
          key: liteavatar-assets-v1-${{ runner.os }}-${{ hashFiles('src/livekit_lite_avatar/renderer/assets.py') }}
      - name: Install livekit-server (and ffmpeg on Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # the binary from LiveKit's official image on Docker Hub (sturdier than GitHub release downloads)
            image=livekit/livekit-server:v1.13.11
            docker pull -q "$image"
            entry=$(docker inspect --format '{{index .Config.Entrypoint 0}}' "$image")
            docker create --name lk "$image" >/dev/null
            sudo docker cp "lk:$entry" /usr/local/bin/livekit-server
            docker rm lk >/dev/null
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          else
            brew install livekit
          fi
          livekit-server --version
      - name: Set up the renderer (venv, pinned dependencies, LiteAvatar assets)
        run: scripts/setup-renderer.sh
      - name: Save LiteAvatar assets
        if: steps.assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/livekit-lite-avatar
          key: ${{ steps.assets.outputs.cache-primary-key }}
      - name: Tests, including the live end-to-end run on a local LiveKit server
        env:
          LITEAVATAR_PERF_CHECKS: "0"  # small shared runners are slower than real time: check behaviour here,
                                       # and report the timing in the benchmark below
        run: .venv/bin/pytest -p no:warnings -rA tests/
      - name: Offline tests with LiteAvatar's own TorchScript face decoder
        env:
          LITEAVATAR_PERF_CHECKS: "0"
          LITEAVATAR_DECODER: torch
        run: .venv/bin/pytest -p no:warnings -rA tests/test_offline.py
      - name: Benchmark
        if: always() && steps.assets.outcome == 'success'
        run: |
          .venv/bin/python scripts/benchmark.py --json bench.json | tee bench.md
          .venv/bin/python scripts/profile_renderer.py | tee profile.txt
          { echo "### Renderer on ${{ matrix.os }}"; echo; cat bench.md; echo; echo '```'; cat profile.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            bench.json
            profile.txt
          if-no-files-found: ignore

  docker:
    name: renderer image
    runs-on: ubuntu-24.04
    needs: renderer  # reuses the assets the Linux renderer job cached
    if: ${{ !cancelled() }}  # a failure on another platform shouldn't skip the image test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: livekit-lite-avatar-renderer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm livekit-lite-avatar-renderer:ci --help
      - name: Restore LiteAvatar assets
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/livekit-lite-avatar
          key: liteavatar-assets-v1-${{ runner.os }}-${{ hashFiles('src/livekit_lite_avatar/renderer/assets.py') }}
          fail-on-cache-miss: true
      - name: Render inside the image (offline test)
        run: |
          chmod -R a+rwX ~/.cache/livekit-lite-avatar
          docker run --rm -v ~/.cache/livekit-lite-avatar:/data livekit-lite-avatar-renderer:ci render \
            /data/lite-avatar/weights/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch/example/asr_example.wav \
            /tmp/out.mp4
