[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "livekit-lite-avatar"
version = "0.1.0"
description = "Self-hosted, CPU-only, lip-synced LiteAvatar video avatar for LiveKit Agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Muhammad Tumi" }]
keywords = ["livekit", "livekit-agents", "avatar", "lip-sync", "talking-head", "liteavatar", "voice-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Agent side only: light, no torch.
dependencies = [
    "livekit-agents>=1.8,<1.9",
    "livekit-api>=1.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
# The renderer process (Python 3.10 to 3.12; tested on 3.10). constraints-renderer.txt pins the tested versions.
renderer = [
    # the worker builds on livekit-agents internals (AvatarRunner, the data-stream receiver): the tested version
    "livekit-agents==1.8.11",
    "numpy>=1.24,<2",
    "scipy>=1.11",
    "torch>=2.1,<2.6",
    "torchaudio>=2.1,<2.6",
    "torchvision>=0.16,<0.21",
    "onnxruntime>=1.17",
    "onnx>=1.16,<1.18",  # to export the face decoder for ONNX Runtime (1.18+ needs protobuf 6)
    "opencv-python-headless>=4.8",
    "librosa>=0.10,<0.11",
    "soundfile>=0.12",
    "pydub>=0.25",
    "loguru>=0.7",
    "tqdm>=4.60",
    # imported by LiteAvatar's bundled FunASR code
    "typeguard>=2.13,<3",
    "modelscope>=1.9,<1.21",
    "oss2>=2.17",
    "sentencepiece>=0.1.99",
    "jamo>=0.4",
    "jaconv>=0.3",
    "torch-complex>=0.4",
    "pyyaml>=6",
    "h5py>=3.8",
    "humanfriendly>=10",
    "setuptools<70",  # pkg_resources
]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/muhammaddevops/livekit-lite-avatar"
Repository = "https://github.com/muhammaddevops/livekit-lite-avatar"
Issues = "https://github.com/muhammaddevops/livekit-lite-avatar/issues"

[project.scripts]
liteavatar-renderer = "livekit_lite_avatar.renderer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livekit_lite_avatar"]

[tool.hatch.build.targets.sdist]
include = ["src", "examples", "tests", "scripts", "README.md", "LICENSE", "constraints-renderer.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S110", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "BLE001"]
